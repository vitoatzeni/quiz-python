<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Learning Hub - Versione 1</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
        }
        h1, h2 {
            color: #2c3e50;
            text-align: center;
        }
        .card {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            padding: 15px 20px;
            margin-bottom: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .card:hover {
            border-color: #3498db;
            background: #ebf5fb;
        }
        .level-container {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .level-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            color: white;
            text-transform: capitalize;
        }
        .btn-beginner { background-color: #2ecc71; }
        .btn-intermediate { background-color: #f39c12; }
        .btn-advanced { background-color: #e74c3c; }
        .level-btn:hover { opacity: 0.9; }
        .btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            margin-top: 15px;
        }
        .btn:hover { background-color: #2980b9; }
        .option-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background: #f1f2f6;
            border: 1px solid #dcdde1;
            border-radius: 6px;
            text-align: left;
            cursor: pointer;
            font-size: 15px;
        }
        .option-btn:hover { background: #dfe4ea; }
        .hidden { display: none; }
        .empty-msg {
            color: #e74c3c;
            font-size: 13px;
            margin-top: 5px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 1. Schermata Selezione Argomenti -->
        <div id="topic-screen">
            <h1>Python Learning Hub</h1>
            <p style="text-align: center; color: #666;">Seleziona un argomento di studio:</p>
            <div id="topics-list"></div>
        </div>

        <!-- 2. Schermata Selezione Livello -->
        <div id="level-screen" class="hidden">
            <h2 id="topic-title">Argomento</h2>
            <p id="topic-desc" style="text-align: center; color: #666; margin-bottom: 20px;"></p>
            <p style="font-weight: bold;">Scegli il livello di difficoltà:</p>
            
            <div id="level-options-container"></div>

            <button id="back-to-topics" class="btn" style="background-color: #95a5a6; margin-top: 20px;">Torna agli Argomenti</button>
        </div>

        <!-- 3. Schermata Quiz -->
        <div id="quiz-screen" class="hidden">
            <h2 id="quiz-header">Quiz</h2>
            <p id="question-text" style="font-weight: bold; font-size: 18px; margin-top: 20px;"></p>
            <div id="options-container"></div>
        </div>

        <!-- 4. Schermata Risultato -->
        <div id="result-screen" class="hidden">
            <h2>Livello Completato! 🎉</h2>
            <p id="final-score" style="font-size: 20px; text-align: center; margin: 20px 0;"></p>
            <button onclick="location.reload()" class="btn">Torna alla Home</button>
        </div>
    </div>

    <script>
        let quizData = {};
        let currentTopic = null;
        let currentLevelKey = null;
        let currentQuestionsList = [];
        let currentQuestionIndex = 0;
        let score = 0;

        async function loadQuizData() {
            try {
                let response = await fetch('questions.json');
                quizData = await response.json();
                renderTopics();
            } catch (error) {
                console.error("Errore nel caricamento del database:", error);
                document.getElementById('topic-screen').innerHTML = "<p style='color:red; text-align:center;'>Errore nel caricamento del database delle domande.</p>";
            }
        }

        function renderTopics() {
            const listContainer = document.getElementById('topics-list');
            listContainer.innerHTML = '';

            quizData.topics.forEach((topic, index) => {
                const card = document.div = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<h3>${topic.title}</h3><p style="margin:5px 0 0 0; color:#666; font-size:14px;">${topic.description}</p>`;
                card.onclick = () => selectTopic(index);
                listContainer.appendChild(card);
            });
        }

        function selectTopic(index) {
            currentTopic = quizData.topics[index];
            document.getElementById('topic-title').innerText = currentTopic.title;
            document.getElementById('topic-desc').innerText = currentTopic.description;

            const levelContainer = document.getElementById('level-options-container');
            levelContainer.innerHTML = '';

            const levelsMeta = [
                { key: 'beginner', label: 'Beginner (Principiante)', class: 'btn-beginner' },
                { key: 'intermediate', label: 'Intermediate (Intermedio)', class: 'btn-intermediate' },
                { key: 'advanced', label: 'Advanced (Avanzato)', class: 'btn-advanced' }
            ];

            levelsMeta.forEach(lvl => {
                const count = currentTopic.levels[lvl.key] ? currentTopic.levels[lvl.key].length : 0;
                
                const wrapper = document.createElement('div');
                wrapper.style.marginBottom = "10px";

                const btn = document.createElement('button');
                btn.className = `btn ${lvl.class}`;
                btn.style.width = "100%";
                btn.innerText = `${lvl.label} (${count} domande)`;
                
                if (count === 0) {
                    btn.style.opacity = "0.5";
                    btn.style.cursor = "not-allowed";
                    btn.disabled = true;
                } else {
                    btn.onclick = () => startQuiz(lvl.key);
                }

                wrapper.appendChild(btn);
                levelContainer.appendChild(wrapper);
            });

            document.getElementById('topic-screen').classList.add('hidden');
            document.getElementById('level-screen').classList.remove('hidden');
        }

        function startQuiz(levelKey) {
            currentLevelKey = levelKey;
            currentQuestionsList = currentTopic.levels[levelKey];
            currentQuestionIndex = 0;
            score = 0;

            document.getElementById('level-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');

            showQuestion();
        }

        function showQuestion() {
            if (currentQuestionIndex >= currentQuestionsList.length) {
                showResult();
                return;
            }

            const q = currentQuestionsList[currentQuestionIndex];
            document.getElementById('quiz-header').innerText = `${currentTopic.title} [${currentLevelKey.toUpperCase()}] (${currentQuestionIndex + 1}/${currentQuestionsList.length})`;
            document.getElementById('question-text').innerText = q.question;

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(idx, q.answer);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selected, correct) {
            if (selected === correct) {
                score++;
            }
            currentQuestionIndex++;
            showQuestion();
        }

        function showResult() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            document.getElementById('final-score').innerText = `Hai totalizzato ${score} su ${currentQuestionsList.length} risposte corrette nel livello ${currentLevelKey}!`;
        }

        document.getElementById('back-to-topics').onclick = () => {
            document.getElementById('level-screen').classList.add('hidden');
            document.getElementById('topic-screen').classList.remove('hidden');
        };

        loadQuizData();
    </script>
</body>
</html>
